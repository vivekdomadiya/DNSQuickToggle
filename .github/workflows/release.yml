name: Release Pipeline

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    # Do not run on automated version bump commits to prevent infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine Version & Tag
        id: version_info
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F "['\"]" '{print $2}')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release Tag: ${TAG} (Version: ${VERSION})"

      - name: Set up Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up Release Keystore
        if: always()
        run: rm -f /tmp/release.jks

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSQuickToggle-${{ steps.version_info.outputs.version }}-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Native gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating asset..."
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_FILE" \
              --title "DNS Quick Toggle $TAG" \
              --generate-notes
          fi

      - name: Bump Version Code & Name via PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/bump-version.py --type patch

          NEW_VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F "['\"]" '{print $2}')
          NEW_VERSION_CODE=$(grep "versionCode" app/build.gradle | head -n 1 | awk '{print $2}')

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BUMP_BRANCH="chore/bump-version-${NEW_VERSION}"
          git checkout -b "$BUMP_BRANCH"
          git add app/build.gradle
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
          git push origin "$BUMP_BRANCH"

          gh pr create \
            --base master \
            --head "$BUMP_BRANCH" \
            --title "chore(release): bump version to ${NEW_VERSION} [skip ci]" \
            --body "Automated version bump to ${NEW_VERSION} (code: ${NEW_VERSION_CODE}) after release."

          gh pr merge "$BUMP_BRANCH" --squash --delete-branch
