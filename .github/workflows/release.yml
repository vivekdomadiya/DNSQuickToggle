name: Release Pipeline

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    # Do not run on automated version bump commits to prevent infinite loops
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Determine Version & Tag
        id: version_info
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          else
            VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F "['\"]" '{print $2}')
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release Tag: ${TAG} (Version: ${VERSION})"

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSQuickToggle-${{ steps.version_info.outputs.version }}-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Native gh CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating asset..."
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_FILE" \
              --title "DNS Quick Toggle $TAG" \
              --generate-notes
          fi

      - name: Bump Version Code & Name for Next Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import re

          path = 'app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()

          # Bump versionCode
          vc_match = re.search(r'versionCode\s+(\d+)', content)
          if vc_match:
              old_vc = int(vc_match.group(1))
              new_vc = old_vc + 1
              content = re.sub(r'versionCode\s+\d+', f'versionCode {new_vc}', content)
          else:
              new_vc = 2

          # Bump versionName patch
          vn_match = re.search(r'versionName\s+[\'\"]([^\'\"]+)[\'\"]', content)
          if vn_match:
              old_vn = vn_match.group(1)
              parts = old_vn.split('.')
              if len(parts) == 3 and parts[2].isdigit():
                  new_vn = f'{parts[0]}.{parts[1]}.{int(parts[2]) + 1}'
              elif len(parts) == 2 and parts[1].isdigit():
                  new_vn = f'{parts[0]}.{int(parts[1]) + 1}.0'
              else:
                  new_vn = f'{old_vn}.1'
              content = re.sub(r'versionName\s+[\'\"][^\'\"]+[\'\"]', f'versionName \'{new_vn}\'', content)
          else:
              new_vn = '1.0.1'

          with open(path, 'w') as f:
              f.write(content)

          print(f'Bumped app/build.gradle: versionCode {old_vc} -> {new_vc}, versionName {old_vn} -> {new_vn}')
          with open('bump_version.env', 'w') as f:
              f.write(f'NEW_VERSION={new_vn}\nNEW_VERSION_CODE={new_vc}\n')
          "

          source bump_version.env
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"

          # Attempt direct push to master; fallback to PR if branch is protected
          if git push origin master; then
            echo "Successfully pushed version bump directly to master."
          else
            echo "Direct push blocked by branch protection. Opening PR..."
            BUMP_BRANCH="chore/bump-version-${NEW_VERSION}"
            git checkout -b "$BUMP_BRANCH"
            git push origin "$BUMP_BRANCH"
            gh pr create \
              --base master \
              --head "$BUMP_BRANCH" \
              --title "chore(release): bump version to ${NEW_VERSION} [skip ci]" \
              --body "Automated version bump to ${NEW_VERSION} (code: ${NEW_VERSION_CODE}) after release."
            gh pr merge "$BUMP_BRANCH" --squash --delete-branch
          fi
