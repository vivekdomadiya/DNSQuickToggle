name: Release Pipeline

on:
  push:
    branches:
      - master

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  master_pipeline:
    name: Build & Release Pipeline
    # If [skip ci] is present, skip CI entirely
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # -----------------------------------------------------------------
      # CASE 1: [release] keyword present -> Build signed release & publish
      # -----------------------------------------------------------------
      - name: Determine Version & Tag
        if: "contains(github.event.head_commit.message, '[release]')"
        id: version_info
        run: |
          VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F "['\"]" '{print $2}')
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release Tag: ${TAG} (Version: ${VERSION})"

      - name: Set up Release Keystore
        if: "contains(github.event.head_commit.message, '[release]')"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.jks

      - name: Build Release APK
        if: "contains(github.event.head_commit.message, '[release]')"
        env:
          KEYSTORE_FILE: /tmp/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Clean up Release Keystore
        if: always()
        run: rm -f /tmp/release.jks

      - name: Upload Release APK Artifact
        if: "contains(github.event.head_commit.message, '[release]')"
        uses: actions/upload-artifact@v4
        with:
          name: DNSQuickToggle-${{ steps.version_info.outputs.version }}-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub Release (Native gh CLI)
        if: "contains(github.event.head_commit.message, '[release]')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Updating asset..."
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" "$APK_FILE" \
              --title "DNS Quick Toggle $TAG" \
              --generate-notes
          fi

      - name: Bump Version Code & Name via PR
        if: "contains(github.event.head_commit.message, '[release]')"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/bump-version-pr.sh patch

      # -----------------------------------------------------------------
      # CASE 2: Normal commit (no [release], no [skip ci]) -> Build only
      # -----------------------------------------------------------------
      - name: Build Only Check
        if: "!contains(github.event.head_commit.message, '[release]')"
        run: |
          echo "==> Normal commit without [release]: running build check..."
          ./gradlew assembleDebug --stacktrace
